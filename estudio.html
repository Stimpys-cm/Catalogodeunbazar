<!DOCTYPE html>
<html lang="es" class="home">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- v37 · La animación entre páginas es adorno: si el navegador la cancela, que no cuente como error -->
  <script>addEventListener('pagereveal',function(e){var v=e.viewTransition;if(v){[v.ready,v.finished,v.updateCallbackDone].forEach(function(p){p&&p.catch(function(){})})}});addEventListener('pageswap',function(e){var v=e.viewTransition;if(v){[v.ready,v.finished,v.updateCallbackDone].forEach(function(p){p&&p.catch(function(){})})}});addEventListener('unhandledrejection',function(e){var r=e.reason;if(r&&/^(InvalidStateError|AbortError)$/.test(r.name||'')&&/Transition was|view ?transition/i.test(r.message||''))e.preventDefault()})</script>
  <title>Estudio de Posts | Stiimpys</title>
  <meta name="description" content="Crea posts profesionales de Instagram con tus prendas, descuentos y avisos. Listos para descargar y subir.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2d6be4">

  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">

  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <!-- Letras propias (css/fuentes): se piden antes para que el texto no cambie de letra al cargar -->
  <link rel="preload" href="css/fuentes/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="css/fuentes/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/dist/estudio.css?v=980847399a">
  <style>html,body{overflow-x:hidden;max-width:100%}</style>
  <script src="js/dist/estudio.js?v=e2feae1721" defer></script>
</head>
<body data-seccion="">

<header>
  <div class="header-row">
    <a href="inicio.html" class="logo">
      <img class="logo-img" src="img/logo-negro-chico.webp" alt="" width="69" height="48" decoding="async" fetchpriority="high"><span class="logo-txt">STIIMPYS</span>
    </a>
    <div class="header-actions">
      <a href="inicio.html" class="h-nav-cta">Inicio</a>
    </div>
  </div>
</header>

<main class="es-main">

  <div class="es-head">
    <h1>Estudio de <em>posts</em></h1>
    <p>Arma posts profesionales para Instagram con tus prendas, descuentos o avisos. Elige un diseño, edítalo y descárgalo listo para subir.</p>
  </div>

  <div class="es-layout">

    <!-- ── PANEL DE CONTROLES ─────────────────────────────── -->
    <aside class="es-panel">

      <div class="es-group">
        <label class="es-lbl">Tipo de post</label>
        <div class="es-chips" id="esTipos">
          <button class="es-chip active" data-tipo="prenda">Prenda</button>
          <button class="es-chip" data-tipo="descuento">Descuento</button>
          <button class="es-chip" data-tipo="apertura">Apertura</button>
          <button class="es-chip" data-tipo="aviso">Aviso</button>
        </div>
      </div>

      <div class="es-group">
        <label class="es-lbl">Formato</label>
        <div class="es-chips" id="esFormatos">
          <button class="es-chip active" data-fmt="post">Post 1:1</button>
          <button class="es-chip" data-fmt="story">Story 9:16</button>
        </div>
      </div>

      <div class="es-group es-solo-prenda">
        <label class="es-lbl">Elige una prenda</label>
        <select class="es-input" id="esPrenda"><option value="">Cargando prendas…</option></select>
      </div>

      <div class="es-group">
        <label class="es-lbl">Imagen</label>
        <div class="es-foto-row">
          <button class="es-btn-sec" id="esSubirFoto" type="button">Subir foto propia</button>
          <input type="file" id="esFile" accept="image/*" hidden>
        </div>
        <div class="es-mini" id="esFotoInfo">Se usa la foto de la prenda elegida.</div>
      </div>

      <div class="es-group">
        <label class="es-lbl" for="esTitulo">Título</label>
        <input class="es-input" id="esTitulo" maxlength="46" placeholder="Título">
      </div>

      <div class="es-group">
        <label class="es-lbl" for="esSubtitulo">Texto</label>
        <input class="es-input" id="esSubtitulo" maxlength="90" placeholder="Texto de apoyo">
      </div>

      <div class="es-group">
        <label class="es-lbl" for="esDestacado" id="esDestacadoLbl">Precio</label>
        <input class="es-input" id="esDestacado" maxlength="24" placeholder="$0">
      </div>

      <div class="es-group">
        <label class="es-lbl" for="esPie">Pie de página</label>
        <input class="es-input" id="esPie" maxlength="40" placeholder="@tubazar · WhatsApp">
      </div>

      <div class="es-group">
        <label class="es-lbl">Color</label>
        <div class="es-colores" id="esColores"></div>
      </div>

      <div class="es-group">
        <label class="es-lbl">Estilo</label>
        <div class="es-chips" id="esEstilos">
          <button class="es-chip active" data-estilo="claro">Claro</button>
          <button class="es-chip" data-estilo="oscuro">Oscuro</button>
          <button class="es-chip" data-estilo="color">Color</button>
        </div>
      </div>

      <button class="es-descargar" id="esDescargar" type="button">Descargar imagen</button>

      <div class="es-ig">
        <label class="es-lbl" for="esIgTexto">Texto para Instagram <span>(opcional)</span></label>
        <textarea id="esIgTexto" rows="3" maxlength="2200" placeholder="Descripción del post (en historias no se usa)"></textarea>
        <button class="es-ig-btn" id="esPublicarIG" type="button">Publicar en Instagram</button>
        <div class="es-mini es-nota" id="esIgNota">Se publica en la cuenta de tu bazar: como post o como historia, según el formato elegido.</div>
      </div>

    </aside>

    <!-- ── LIENZO ─────────────────────────────────────────── -->
    <div class="es-stage">
      <div class="es-canvas-wrap" id="esCanvasWrap">
        <canvas id="esCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>

  </div>
</main>

</body>
</html>
